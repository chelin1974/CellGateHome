# CellGateHome under plain Docker, with its own metrics stack.
#
#   cp cellgate.config.k8s.example.json cellgate.config.json
#   $EDITOR cellgate.config.json
#   docker compose up -d                      # the bridge only
#   docker compose --profile metrics up -d    # bridge + its own Prometheus + Grafana
#   docker compose logs -f                    # the HomeKit setup code is printed at startup
#
# With the metrics profile, set this in cellgate.config.json so the bridge pushes to the
# Prometheus below:
#
#   "prometheusUrl": "http://localhost:9092"
#
# Everything here is CellGateHome's own: its own Prometheus config, its own Grafana
# provisioning, its own volumes, and its own ports. It shares nothing with the DaikinHome
# or SpanHome bridges, so it runs with or without them. Its ports are its own, so this stack
# runs alongside either of theirs:
#
#   SpanHome      Prometheus 9090   Grafana 3000
#   DaikinHome    Prometheus 9090   Grafana 3000
#   CellGateHome  Prometheus 9092   Grafana 3002
#
# SpanHome and DaikinHome serve theirs on the same pair, so run only one of those two and
# point both of those bridges at it.
#
# The compose project name keeps this stack's containers and volumes separate from the
# others even though the service names are similar.
name: cellgate-home

services:
  cellgate-home:
    build: .
    image: ghcr.io/chelin1974/cellgate-home:latest
    container_name: cellgate-home
    restart: unless-stopped

    # Required, not optional. HomeKit discovery is mDNS multicast on the local link, and a
    # container on Docker's bridge network can neither send nor receive it - the Home app
    # would simply never find the bridge. Host networking also means the dashboard is on
    # the host's own port 8090, so there is no `ports:` mapping here.
    #
    # On Docker Desktop for Mac or Windows, host networking does not give you the real LAN,
    # so this will not work there. Run it on the Linux box that is on your network.
    network_mode: host

    environment:
      # The Spring Boot flavour reads the same cellgate.config.json the CLI reads; this points
      # it at the copy on the mounted data directory rather than one beside the jar.
      CELLGATE_CONFIG_FILE: /data/cellgate.config.json
      # Every file the bridge writes goes here, on the bind mount below. The config now sits in
      # /data too, so this is where they would land anyway - set explicitly so it is a declared
      # fact rather than a consequence of where the config happens to be.
      CELLGATE_DATA_DIRECTORY: /data

    volumes:
      # HomeKit pairing state, on a bind mount rather than a named volume so it is an
      # ordinary file you can see, back up, and share with a run outside Docker. A named
      # volume kept it inside Docker's own storage, which meant a bridge already paired from
      # the command line looked brand new to the container, and the Home app was asked to
      # pair all over again. Losing this file un-pairs every controller.
      - ./data:/data

    # Tomcat refuses to start without a writable temp dir, and on the container's writable
    # layer that is a disk write - so a full Docker disk stops the bridge booting at all, with a
    # stack trace that points at Tomcat rather than at the disk. In RAM it cannot be filled by
    # anything else, and nothing here needs to survive a restart.
    tmpfs:
      - /tmp:size=64m

    healthcheck:
      # /healthz turns 503 once the mDNS responder has died, which is the failure that
      # matters here: the dashboard keeps serving perfectly while nothing in Apple Home can
      # reach the bridge.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 4

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["metrics"]
    container_name: cellgate-home-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
      - --web.enable-otlp-receiver
    ports:
      # Only this machine: the bridge pushes here over the host network. 9092 rather than
      # 9090 so the SpanHome and DaikinHome stacks can run at the same time.
      - "127.0.0.1:9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["metrics"]
    container_name: cellgate-home-grafana
    depends_on: [prometheus]
    ports:
      # 3002 rather than 3000 so the SpanHome and DaikinHome stacks can run at the same time.
      - "3002:3000"
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/cellgate-home.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

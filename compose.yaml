# Plain Docker, without Kubernetes.
#
#   cp cellgate.config.k8s.example.json cellgate.config.json
#   $EDITOR cellgate.config.json
#   docker compose up -d
#   docker compose logs -f        # the HomeKit setup code is printed at startup
#
services:
  cellgate-home:
    build: .
    image: ghcr.io/chelin1974/cellgate-home:latest
    container_name: cellgate-home
    restart: unless-stopped

    # Required, not optional. HomeKit discovery is mDNS multicast on the local link, and
    # a container on Docker's bridge network can neither send nor receive it - the Home
    # app would simply never find the bridge. Host networking also means the dashboard is
    # on the host's own port 8090, so there is no `ports:` mapping here.
    #
    # On Docker Desktop for Mac or Windows, host networking does not give you the real
    # LAN, so this will not work there. Run it on the Linux box that is on your network.
    network_mode: host

    volumes:
      # Holds the CellGate password, so it is mounted rather than baked into the image.
      # Set "storagePath": "/data/cellgate-home.state.json" inside it.
      - ./cellgate.config.json:/config/cellgate.config.json:ro
      # HomeKit pairing state. Losing this un-pairs every controller.
      - cellgate-state:/data

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 4

volumes:
  cellgate-state:
